[(Difficulty)]

## Base damage modifier from enemies (stacks with world and mod modifiers); and final damage modifier from enemies (only after applying resistances and armor, which works differently from a world modifier or typical mod modifier):
## 
## Vanilla: No changes (too easy for a demigod)
## 
## Novice: Base damage = +0%
## Final damage = +25% (+50% for bosses)
## 
## Adept: Base damage = +0%
## Final damage = +50% (+100% for bosses)
## 
## Expert: Base damage = +0%
## Final damage = +75% (+150% for bosses)
## 
## Elite: Base damage = +0%
## Final damage = +100% (+200% for bosses)
## 
## Hardcore: Base damage = +25%
## Final damage = +100% (+200% for bosses)
## 
## Insane: Base damage = +50%
## Final damage = +100% (+200% for bosses)
# Setting type: String
# Default value: Vanilla
# Acceptable values: Vanilla, Novice, Adept, Expert, Elite, Hardcore, Insane
